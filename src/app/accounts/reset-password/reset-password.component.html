<div class="tui-container tui-container_adaptive">
  <div class="tui-row tui-row_adaptive">
    <div class="tui-space_auto tui-col_xs-12 tui-col_md-8 tui-col_lg-6">
      <div class="tui-space_auto tui-space_vertical-10 recovery-brand">
        <img [src]="logoPath" alt="logo">
      </div>
      @if (emailSent) {
        <form (ngSubmit)="onSubmit()" [formGroup]="formGroup">
          <h2 class="tui-form__header">Reset Password</h2>
          <div class="tui-form__row">
            <tui-textfield aria-label="New Password" >
<label tuiLabel>New Password
            </label>

<input tuiInput type="password" formControlName="password" />
<tui-icon tuiPassword />
</tui-textfield>
            <tui-error  formControlName="password"></tui-error>
          </div>
          <div class="tui-form__row">
            <div tuiNotification size="m" icon="" appearance="info"><div>
              <ul class="tui-list tui-list_small">
                <li class="tui-list__item">Your password must contain at least 8 characters.</li>
                <li class="tui-list__item">Your password can’t be entirely numeric.</li>
              </ul>
            </div></div>
          </div>
          <div class="tui-form__row">
            <tui-textfield aria-label="Confirm New Password" >
<label tuiLabel>Confirm New
              Password
            </label>

<input tuiInput type="password" formControlName="password2" />
<tui-icon tuiPassword />
</tui-textfield>
            <tui-error  formControlName="password2"></tui-error>
          </div>
          <div class="tui-form__buttons">
            <button
              [disabled]="formGroup.invalid"
              aria-label="Reset Password"
              class="tui-form__button recovery-button__wide"
              size="m"
              tuiButton
              type="submit"
              >
              Reset Password
            </button>
          </div>
        </form>
      } @else {
        <form (ngSubmit)="submitEmail()" [formGroup]="formGroup">
          <h2 class="tui-form__header">Send Recovery Email</h2>
          <div class="tui-form__row">
            <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
            <tui-textfield aria-label="Email">
            <label tuiLabel>Email</label>
            <input tuiInput formControlName="email" />
            </tui-textfield>
            <tui-error  formControlName="email"></tui-error>
          </div>
          <div class="tui-form__buttons">
            <button
              [disabled]="formGroup.invalid"
              aria-label="Send Email"
              class="tui-form__button recovery-button__wide"
              size="m"
              tuiButton
              type="submit"
              >
              Send Email
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
