<div class="tui-container tui-container_adaptive">
  <div class="tui-space_bottom-10">
    <div class="tui-space_auto tui-space_vertical-10 consent-brand">
      <img [src]="logoPath" alt="logo">
    </div>
    <h1 class="tui-text_h3">Please Read our Informed Consent Form</h1>
    <p class="tui-space_bottom-4">Thank you for your email confirmation. Your Account has been
      successfully
    activated.</p>
    @if (user.is_teacher) {
      <app-admin-terms-and-conditions-snippet></app-admin-terms-and-conditions-snippet>
    }
    @if (user.is_student) {
      <app-student-terms-and-conditions-snippet></app-student-terms-and-conditions-snippet>
    }
    <form (ngSubmit)="onSubmit()" [formGroup]="formGroup" class="tui-space_top-4">
      @if (user.is_student) {
        <div class="tui-form__row">
          <label tuiLabel> <input tuiCheckbox type="checkbox" aria-label="Provide Access to Submitted Course Work"
            formControlName="access_submitted_course_work"
            size="m">
            I am willing to provide access to my submitted course work.
          </label>
        </div>
        <div class="tui-form__row">
          <label tuiLabel> <input tuiCheckbox type="checkbox"
            aria-label="Provide Access to Course Grades Associated with Submitted Work"
            formControlName="access_course_grades"
            size="m">
            I am willing to provide access to my course grades associated with the
            submitted work.
          </label>
        </div>
      }
      <div class="tui-form__row tui-form__row_multi-fields">
        <div class="tui-form__multi-field">
          <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
          <tui-textfield aria-label="First Name">
          <label tuiLabel>Type in your first name:</label>
          <input tuiInput formControlName="legal_first_name" />
<span class="tui-required"></span>          </tui-textfield>
          <tui-error  formControlName="legal_first_name"></tui-error>
        </div>
        <div class="tui-form__multi-field">
          <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
          <tui-textfield aria-label="Last Name">
          <label tuiLabel>Type in your last name:</label>
          <input tuiInput formControlName="legal_last_name" />
<span class="tui-required"></span>          </tui-textfield>
          <tui-error  formControlName="legal_last_name"></tui-error>
        </div>
      </div>
      <div class="tui-form__row">
        <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
        <tui-textfield aria-label="Student Number">
        <label tuiLabel>Type in your student number (this is only needed in case there are
          students with the same first and last name):</label>
        <input tuiInput formControlName="student_number" />
<span class="tui-required"></span>        </tui-textfield>
        <tui-error  formControlName="student_number"></tui-error>
      </div>
      <div class="tui-form__row">
        <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron aria-label="Gender"
          [content]="genderContent">
<label tuiLabel>
          What gender do you identify as?
          </label>

<input tuiSelect formControlName="gender" />
<span class="tui-required"></span>
          <tui-data-list-wrapper
            *tuiDropdown
            [items]="genders"
            [itemContent]="genderContent"
          ></tui-data-list-wrapper>
          <ng-template
            #genderContent
            let-gender
            >
            {{genderMapper[gender]}}
          </ng-template>
        </tui-textfield>
        <tui-error  formControlName="gender"></tui-error>
      </div>
      <div class="tui-form__row">
        <tui-textfield multi tuiChevron aria-label="Race">
          <label tuiLabel>
            What is your cultural background? Choose all that apply.
          </label>
          <input tuiInputChip formControlName="race" />
<span class="tui-required"></span>
          <tui-data-list
            *tuiDropdown
            tuiMultiSelectGroup
            >
            @for (item of races; track item) {
              <button
                tuiOption
                [value]="item"
                >
                {{ item }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
        <tui-error  formControlName="race"></tui-error>
      </div>
      <div class="tui-form__row">
        <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
        <tui-textfield aria-label="Today's Date">
        <label tuiLabel>Type in today's date:</label>
        <input tuiInput formControlName="date" />
<span class="tui-required"></span>        </tui-textfield>
        <tui-error  formControlName="date"></tui-error>
      </div>
      <div class="tui-form__buttons">
        <button
          [disabled]="formGroup.invalid"
          aria-label="I Consent"
          class="tui-form__button"
          size="m"
          tuiButton
          type="submit"
          >
          I Consent
        </button>
        <button
          (click)="declineConsent()"
          appearance="flat"
          aria-label="I Do Not Consent"
          class="tui-form__button"
          routerLink="../profile"
          size="m"
          tuiButton
          type="button"
          >
          I Do Not Consent
        </button>
      </div>
    </form>
  </div>
</div>
