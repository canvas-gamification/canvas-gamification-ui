<tui-multi-select [formControl]="variationControl" aria-label="Variation Types">
  Variation Types Used in Question
  <span class="tui-required"></span>
  <tui-data-list
    *tuiDataList
    tuiMultiSelectGroup
    >
    @for (item of variationTypes; track item) {
      <button
        tuiOption
        [value]="item"
        >
        {{ item }}
      </button>
    }
  </tui-data-list>
</tui-multi-select>
