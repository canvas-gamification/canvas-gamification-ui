<tui-textfield multi tuiChevron aria-label="Variation Types">
  Variation Types Used in Question
  <input tuiInputChip [formControl]="variationControl" />
<span class="tui-required"></span>
  <tui-data-list
    *tuiDropdown
    tuiMultiSelectGroup
    >
    @for (item of variationTypes; track item) {
      <button
        tuiOption
        [value]="item"
        >
        {{ item }}
      </button>
    }
  </tui-data-list>
</tui-textfield>
