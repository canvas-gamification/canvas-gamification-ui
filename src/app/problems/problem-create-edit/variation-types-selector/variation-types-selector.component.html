<tui-textfield multi tuiChevron aria-label="Variation Types" [tuiTextfieldCleaner]="false">
  <label tuiLabel>Variation Types Used in Question<span class="tui-required"></span></label>
  <input tuiInputChip [formControl]="variationControl" />
  <tui-data-list
    *tuiDropdown
    tuiMultiSelectGroup
    >
    @for (item of variationTypes; track item) {
      <button
        tuiOption
        [value]="item"
        >
        {{ item }}
      </button>
    }
  </tui-data-list>
</tui-textfield>
