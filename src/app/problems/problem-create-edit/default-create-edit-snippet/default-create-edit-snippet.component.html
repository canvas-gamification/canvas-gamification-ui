<div [formGroup]="formGroup">
  <div class="tui-form__row">
    <tui-textfield>
    <label tuiLabel>Question Name</label>
    <input tuiInput formControlName="title" />
    </tui-textfield>
    <tui-error  formControlName="title"></tui-error>
  </div>
  <div class="tui-form__row">
    <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
      [content]="difficulties ? (difficulties | stringifyTuiDataList: 0: 1) : ''"
      >
<label tuiLabel>
      Difficulty
      </label>

<input tuiSelect formControlName="difficulty" />
<tui-data-list *tuiDropdown>
        @for (difficulty of difficulties; track difficulty) {
          <button [value]="difficulty[0]" tuiOption>
            {{ difficulty[1] }}
          </button>
        }
      </tui-data-list>
      <tui-error  formControlName="difficulty"></tui-error>
    </tui-textfield>
  </div>
  <div class="tui-form__row">
    <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
      [content]="categories ? (categories | stringifyTuiDataList: 'pk': 'full_name') : ''"
      >
<label tuiLabel>
      Category
      </label>

<input tuiSelect formControlName="category" />
<tui-data-list *tuiDropdown>
        @for (category of categories; track category) {
          <button [value]="category.pk" tuiOption>
            {{ category.full_name }}
          </button>
        }
      </tui-data-list>
    </tui-textfield>
    <tui-error  formControlName="category"></tui-error>
  </div>
  <div class="tui-form__row">
    <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="is_verified" size="m">Is Verified
    </label>
  </div>
  <div class="tui-form__row">
    <label tuiLabel> <input tuiCheckbox type="checkbox"
      (ngModelChange)="resetCourseIfPractice($event)"
      [ngModelOptions]="{standalone: true}"
      [ngModel]="isPractice"
      [disabled]="disableEvent"
      size="m"
      >
      Practice Question
    </label>
  </div>
  @if (!isPractice) {
    <div class="tui-form__row tui-form__row_multi-fields">
      <div class="tui-form__multi-field">
        <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
          [tuiTextfieldCleaner]="true"
          [content]="courses ? (courses | stringifyTuiDataList: 'id': 'name') : ''"
          >
<label tuiLabel>
          Course
          </label>

<input tuiSelect formControlName="course" />
<tui-data-list *tuiDropdown>
            @for (course of courses; track course) {
              <button [value]="course.id" tuiOption>
                {{ course.name }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
        <tui-error  formControlName="course"></tui-error>
      </div>
      <div class="tui-form__multi-field">
        <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
          [tuiTextfieldCleaner]="true"
          [content]="events ? (events | stringifyTuiDataList: 'id': 'name') : ''"
          >
<label tuiLabel>
          Assessment
          </label>

<input tuiSelect formControlName="event" />
<tui-data-list *tuiDropdown>
            @for (event of events; track event) {
              <button [value]="event.id" tuiOption>
                {{ event.name }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
        <tui-error  formControlName="event"></tui-error>
      </div>
    </div>
  }
  <ng-content></ng-content>
</div>
