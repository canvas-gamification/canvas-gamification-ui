<form (ngSubmit)="onSubmit()">
  <div class="tui-island tui-island_size_m tui-space_top-6">
    <div class="tui-island__content">
      <div class="tui-island__figure">
        <app-tab-list-view-switcher #viewSwitcher></app-tab-list-view-switcher>
      </div>
      <h2 class="tui-island__category tui-text_body-xs">Complete The Following</h2>
    </div>
    <div class="island_container">
      @if (viewSwitcher.view === 'tab') {
        <tui-tabs-with-more [(activeItemIndex)]="activeTabIndex" class="tui-space_bottom-4">
          @for (input of inputFileNames; track input) {
            <button *tuiItem tuiTab>
              {{ input.name }}
            </button>
          }
        </tui-tabs-with-more>
        @for (input of inputFileNames; track input; let index = $index) {
          <div>
            @if (activeTabIndex === index) {
              <div>
                <app-code-editor [(codeTemplate)]="input.template"></app-code-editor>
              </div>
            }
          </div>
        }
      } @else {
        <div class="code-editors__list">
          @for (input of inputFileNames; track input) {
            <div>
              <p class="code-editors__list-title">{{ input.name }}</p>
              <app-code-editor [(codeTemplate)]="input.template"></app-code-editor>
            </div>
          }
        </div>
      }
    </div>
  </div>
  <div class="tui-form__buttons">
    <button
      [disabled]="!canSubmit()"
      [loading]="waitingSubmission"
      class="tui-form__button"
      size="m"
      tuiButton
      >
      Submit
    </button>
  </div>
</form>
