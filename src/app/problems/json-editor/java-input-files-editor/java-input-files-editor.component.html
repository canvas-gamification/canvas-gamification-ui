@for (form of models.controls; track form; let index = $index) {
  <form [formGroup]="form | asFormGroup" class="tui-space_bottom-4">
    <div class="tui-island tui-island_size_m">
      <div class="tui-island__content">
        <div class="tui-island__figure">
          <button
            (click)="removeModel(index)"
            [tuiHint]="removeTooltip"
            iconStart="@tui.trash"
            size="m"
            id="remove-{{index}}"
            tuiHintDirection="top-start"
            tuiHintDescribe="remove-{{index}}"
            tuiHintAppearance="dark"
            tuiIconButton
            type="button"
          ></button>
          <ng-template #removeTooltip>
            Remove Value
          </ng-template>
        </div>
        <div class="content__island">
          <h2 class="tui-island__title">
            Java Input File
          </h2>
          <div class="tui-row tui-row_adaptive">
            <div class="tui-col_8">
              <div class="tui-form__row">
                <tui-textfield>
                <label tuiLabel>Name</label>
                <input tuiInput formControlName="name" />
                </tui-textfield>
                <tui-error  formControlName="name"></tui-error>
              </div>
              <div class="tui-form__row flex">
                <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="compile" class="mr-4">
                  Should this file be compiled?
                </label>
                <tui-error  formControlName="compile"></tui-error>
                <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="hidden">
                  Should this file be hidden?
                </label>
                <tui-error  formControlName="hidden"></tui-error>
              </div>
              <div class="tui-form__row">
                <label class="tui-form__field-note" for="code-editor-{{index}}">
                  Template of the File
                </label>
                <app-code-editor
                  (codeTemplateChange)="setInputTemplate(form, $event)"
                  [codeTemplate]="(form | asFormGroup).controls.template.value"
                  id="code-editor-{{index}}"
                ></app-code-editor>
                <tui-error  formControlName="template"></tui-error>
              </div>
            </div>
            <div class="tui-col_4">
              <tui-textfield class="content__island-json">
              <label tuiLabel>JSON</label>
              <textarea tuiTextarea (ngModelChange)="setFormFromString(form, $event)" [ngModel]="getFormString(form)" [ngModelOptions]="{standalone: true}"></textarea>
              </tui-textfield>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
}
<button
  (click)="addNewModel()"
  iconStart="@tui.plus"
  size="m"
  tuiButton
  type="button"
  >
  Add New Java Input File
</button>
