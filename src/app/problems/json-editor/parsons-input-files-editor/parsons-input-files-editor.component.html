<form *ngFor="let form of models.controls; index as index" [formGroup]="form | asFormGroup" class="tui-space_bottom-4">
    <tui-island>
        <div class="tui-island__content">
            <div class="tui-island__figure">
                <button
                    (click)="removeModel(index)"
                    [tuiHint]="removeTooltip"
                    iconStart="@tui.trash"
                    size="m"
                    id="remove-{{index}}"
                    tuiHintDirection="top-left"
                    tuiHintDescribe="remove-{{index}}"
                    tuiHintAppearance="dark"
                    tuiIconButton
                    type="button"
                ></button>
                <ng-template #removeTooltip>
                    Remove Value
                </ng-template>
            </div>
            <div class="content__island">
                <h2 class="tui-island__title">
                    Parsons Input File
                </h2>
                <div class="tui-row tui-row_adaptive">
                    <div class="tui-col_8">
                        <div class="tui-form__row">
                            <tui-input formControlName="name">Name</tui-input>
                            <tui-error [error]="[] | tuiFieldError | async" formControlName="name"></tui-error>
                        </div>
                        <div class="tui-form__row">
                           <label tuiLabel> <input tuiCheckbox type="checkbox" formControlName="compile">
                                Should This File Be Compiled?
                            </label>
                            <tui-error [error]="[] | tuiFieldError | async" formControlName="compile"></tui-error>
                        </div>
                        <div class="tui-form__row">
                            <div class="tui-form__field-note">Lines</div>
                            <tui-island *ngIf="getLines(form).value.length > 0" class="tui-space_bottom-4">
                                <div
                                    *ngFor="let line of getLines(form).controls; let index = index"
                                    class="tui-form__row lines-control"
                                >
                                    <div class="tui-space_right-4 lines-control__input" formArrayName="lines">
                                        <tui-input [formControl]="line | asFormControl">
                                            Line {{ index + 1 }}
                                        </tui-input>
                                        <tui-error [error]="[] | tuiFieldError | async" [formControl]="line | asFormControl"></tui-error>
                                    </div>
                                    <button
                                        (click)="removeLine(form, index)"
                                        [tuiHint]="removeTooltip"
                                        iconStart="@tui.trash"
                                        size="m"
                                        id="remove-line-{{index}}"
                                        tuiHintDirection="top-left"
                                        tuiHintDescribe="remove-line-{{index}}"
                                        tuiHintAppearance="dark"
                                        tuiIconButton
                                        type="button"
                                    ></button>
                                    <ng-template #removeTooltip>
                                        Remove Line
                                    </ng-template>
                                </div>
                            </tui-island>
                            <div class="tui-form__buttons tui-space_top-2">
                                <button
                                    (click)="addNewLine(form)"
                                    class="tui-form__button"
                                    iconStart="@tui.plus"
                                    size="m"
                                    tuiButton
                                    type="button"
                                >
                                    Add New Line
                                </button>
                                <div
                                    [tuiDropdown]="codeBlockDropdown"
                                    [(tuiDropdownOpen)]="codeBlockDropdownOpen"
                                    class="tui-form__button"
                                >
                                    <button
                                        [tuiAppearanceState]="codeBlockDropdownOpen ? 'active' : null"
                                        class="code-block-dropdown_button"
                                        iconStart="@tui.code"
                                        iconEnd="@tui.chevron-down"
                                        size="m"
                                        tuiButton
                                        type="button"
                                    >
                                        Set With Code Block
                                    </button>
                                </div>
                                <ng-template #codeBlockDropdown>
                                    <form
                                        (submit)="setLinesFromCodeBlock(form); codeBlockDropdownOpen = false"
                                        class="code-block-dropdown"
                                    >
                                        <app-code-editor [(codeTemplate)]="codeBlock"></app-code-editor>
                                        <div class="tui-form__buttons tui-space_top-2">
                                            <button
                                                class="tui-form__button"
                                                size="s"
                                                tuiButton
                                            >
                                                Set Code
                                            </button>
                                        </div>
                                    </form>
                                </ng-template>
                            </div>
                        </div>
                    </div>
                    <div class="tui-col_4">
                        <tui-textarea 
                            (ngModelChange)="setFormFromString(form, $event)"
                            [expandable]="true"
                            [ngModelOptions]="{standalone: true}"
                            [ngModel]="getFormString(form)"
                            class="content__island-json"
                        >
                            JSON
                        </tui-textarea>
                    </div>
                </div>
            </div>
        </div>
    </tui-island>
</form>
<button
    (click)="addNewModel()"
    iconStart="@tui.plus"
    size="m"
    tuiButton
    type="button"
>
    Add New Parsons Input File
</button>
