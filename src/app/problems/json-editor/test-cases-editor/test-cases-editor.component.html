@for (form of models.controls; track form; let index = $index) {
  <form [formGroup]="form | asFormGroup" class="tui-space_bottom-4">
    <tui-island>
      <div class="tui-island__content">
        <div class="tui-island__figure">
          <button
            (click)="removeModel(index)"
            [tuiHint]="removeTooltip"
            iconStart="@tui.trash"
            size="m"
            id="remove-{{index}}"
            tuiHintDirection="top-left"
            tuiHintDescribe="remove-{{index}}"
            tuiHintAppearance="dark"
            tuiIconButton
            type="button"
          ></button>
          <ng-template #removeTooltip>
            Remove Value
          </ng-template>
        </div>
        <div class="content__island">
          <h2 class="tui-island__title">
            Test Case
          </h2>
          <div class="tui-row tui-row_adaptive">
            <div class="tui-col_8">
              <div class="tui-form__row">
                <tui-input formControlName="input">Standard Input of This Test Case</tui-input>
                <tui-error [error]="[] | tuiFieldError | async" formControlName="input"></tui-error>
              </div>
              <div class="tui-form__row">
                <tui-input formControlName="output">Expected Output of This Test Case</tui-input>
                <tui-error [error]="[] | tuiFieldError | async" formControlName="output"></tui-error>
              </div>
            </div>
            <div class="tui-col_4">
              <tui-textarea
                (ngModelChange)="setFormFromString(form, $event)"
                [expandable]="true"
                [ngModelOptions]="{standalone: true}"
                [ngModel]="getFormString(form)"
                class="content__island-json"
                >
                JSON
              </tui-textarea>
            </div>
          </div>
        </div>
      </div>
    </tui-island>
  </form>
}
<button
  (click)="addNewModel()"
  iconStart="@tui.plus"
  size="m"
  tuiButton
  type="button"
  >
  Add New Test Case
</button>
