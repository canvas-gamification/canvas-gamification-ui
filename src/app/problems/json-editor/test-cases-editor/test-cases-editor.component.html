@for (form of models.controls; track form; let index = $index) {
  <form [formGroup]="form | asFormGroup" class="tui-space_bottom-4">
    <div tuiCardLarge>
      <div class="tui-island__content">
        <div class="tui-island__figure">
          <button
            (click)="removeModel(index)"
            [tuiHint]="removeTooltip"
            iconStart="@tui.trash"
            size="m"
            id="remove-{{index}}"
            tuiHintDirection="top-start"
            tuiHintDescribe="remove-{{index}}"
            tuiHintAppearance="dark"
            tuiIconButton
            type="button"
          ></button>
          <ng-template #removeTooltip>
            Remove Value
          </ng-template>
        </div>
        <div class="content__island">
          <h2 class="tui-island__title">
            Test Case
          </h2>
          <div class="tui-row tui-row_adaptive">
            <div class="tui-col_8">
              <div class="tui-form__row">
                <tui-textfield>
                <label tuiLabel>Standard Input of This Test Case</label>
                <input tuiInput formControlName="input" />
                </tui-textfield>
                <tui-error  formControlName="input"></tui-error>
              </div>
              <div class="tui-form__row">
                <tui-textfield>
                <label tuiLabel>Expected Output of This Test Case</label>
                <input tuiInput formControlName="output" />
                </tui-textfield>
                <tui-error  formControlName="output"></tui-error>
              </div>
            </div>
            <div class="tui-col_4">
              <!-- TODO: (Taiga UI migration) tui-textarea migration (see https://taiga-ui.dev/components/textarea):
     - [expandable] was removed. New component always auto-resizes between [min] (default: 1) and [max] (default: 3) rows.
     - Unrecognized attribute "[ngModelOptions]="{standalone: true}"" was placed on <tui-textfield>. Move it to <textarea tuiTextarea> if it targets the native element.
     - Unrecognized attribute "class="content__island-json"" was placed on <tui-textfield>. Move it to <textarea tuiTextarea> if it targets the native element.
-->
              <tui-textfield [ngModelOptions]="{standalone: true}" class="content__island-json">
              <label tuiLabel>JSON</label>
              <textarea tuiTextarea (ngModelChange)="setFormFromString(form, $event)" [ngModel]="getFormString(form)"></textarea>
              </tui-textfield>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
}
<button
  (click)="addNewModel()"
  iconStart="@tui.plus"
  size="m"
  tuiButton
  type="button"
  >
  Add New Test Case
</button>
