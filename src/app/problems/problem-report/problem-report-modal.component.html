<ng-template
  (tuiDialogChange)="toggleDialog($event)"
  [tuiDialogOptions]="$any({ label: 'Report this question', size: 'm' })"
  [tuiDialog]="open"
  >
  <div [formGroup]="formGroup">
    <div class="tui-form__row">
      <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
        [content]="reportOptions ? (reportOptions | stringifyTuiDataList: 0: 1) : ''"
        >
<label tuiLabel>
        Reason
        </label>

<input tuiSelect formControlName="report" />
<tui-data-list *tuiDropdown>
          @for (reportOption of reportOptions; track reportOption) {
            <button [value]="reportOption[0]" tuiOption>
              {{ reportOption[1] }}
            </button>
          }
        </tui-data-list>
        <tui-error  formControlName="report"></tui-error>
      </tui-textfield>
    </div>
    <div class="tui-form__row">
      <!-- TODO: (Taiga UI migration) tui-textarea migration (see https://taiga-ui.dev/components/textarea):
     - Legacy tui-textarea had a fixed height of 20 rows by default. New component auto-resizes between [min] (default: 1) and [max] (default: 3) rows. Set min and max explicitly if the previous layout needs to be preserved.
-->
      <tui-textfield>
      <label tuiLabel>Details</label>
      <textarea tuiTextarea formControlName="report_details"></textarea>
      </tui-textfield>
    </div>
  </div>
  <div class="tui-form__row">
    <button
      (click)="submitReport()"
      [disabled]="formGroup.invalid"
      size="m"
      tuiButton
      type="submit"
      >
      Submit Report
    </button>
  </div>
</ng-template>
