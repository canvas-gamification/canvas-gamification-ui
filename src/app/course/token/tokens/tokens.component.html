@if (!!grades) {
  <section class="tui-container tui-container_fullwidth">
    <div class="flex justify-center">
      <div
        tuiGroup
        class=""
        [collapsed]="true"
        [rounded]="true"
        >
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="l"
          class="whitespace-nowrap"
          (click)="setDetailedView(false)"
          [tuiAppearanceState]="!showDetailed ? 'active' : null"
          >
          Overview
        </button>
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="l"
          class="whitespace-nowrap"
          (click)="setDetailedView(true)"
          [tuiAppearanceState]="showDetailed ? 'active' : null"
          >
          Detailed View
        </button>
      </div>
    </div>
    <div class="py-3 space-y-3">
      <div class="flex gap-3 items-center py-3">
        <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "(ngModelChange)" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
        <tui-textfield [tuiTextfieldCleaner]="true" class="w-64" (ngModelChange)="update({query: $event})">
        <label tuiLabel>Search for a Student Name</label>
        <input tuiInput [ngModel]="query" />
        </tui-textfield>
        <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
          [tuiTextfieldCleaner]="true"
          [content]="events ? (events | stringifyTuiDataList: 'name': 'name') : ''"
          class="w-48"
          (ngModelChange)="update({event: $event})">
<label tuiLabel>
          Event Name
          </label>

<input tuiSelect [ngModel]="event" />
<tui-data-list *tuiDropdown [class.tui-skeleton]="!events">
            @for (event of events; track event) {
              <button [value]="event.name" tuiOption>
                {{ event.name }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
        <a
          appearance="primary"
          size="m"
          tuiButton
          [href]="getUrl()"
          >
          Download
        </a>
      </div>
      @if (showDetailed) {
        <app-token-detailed-view
        [displayData]="gradesDisplayData"></app-token-detailed-view>
      }
      @if (!showDetailed) {
        <app-token-overview
        [displayData]="gradesDisplayData"></app-token-overview>
      }
    </div>
  </section>
} @else {
  <section class="tui-container tui-container_fullwidth">
    <div class="flex justify-center">
      <div
        tuiGroup
        class=""
        [collapsed]="true"
        [rounded]="true"
        >
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="l"
          class="whitespace-nowrap tui-skeleton"
          [tuiAppearanceState]="!showDetailed ? 'active' : null"
          >
          Overview
        </button>
        <button
          tuiButton
          type="button"
          appearance="secondary"
          size="l"
          class="whitespace-nowrap tui-skeleton"
          [tuiAppearanceState]="showDetailed ? 'active' : null"
          >
          Detailed View
        </button>
      </div>
    </div>
    <div class="py-3 space-y-3">
      <div class="flex gap-3 items-center pt-3">
        <tui-textfield [tuiTextfieldCleaner]="true" class="w-64 tui-skeleton">
        <label tuiLabel>Search for a Student Name</label>
        <input tuiInput />
        </tui-textfield>
        <!-- TODO: (Taiga UI migration) tui-select was partially migrated. Complete migration manually. See examples: https://taiga-ui.dev/components/select -->
<tui-textfield tuiChevron
          [tuiTextfieldCleaner]="true"
          [content]="events ? (events | stringifyTuiDataList: 'name': 'name') : ''"
          class="w-48 tui-skeleton"
          >
<label tuiLabel>
          Event Name
        </label>

<input tuiSelect />
</tui-textfield>
        <a
          class="tui-skeleton"
          appearance="primary"
          size="m"
          tuiButton
          >
          Download
        </a>
      </div>
      <table
        [columns]="['name', 'event_name', 'grade']"
        class="w-full tui-skeleton"
        tuiTable
        >
        <thead tuiThead>
          <tr tuiThGroup>
            <th *tuiHead="'name'" tuiTh>Name</th>
            <th *tuiHead="'event_name'" tuiTh>Event Name</th>
            <th *tuiHead="'grade'" tuiTh>Tokens Earned</th>
          </tr>
        </thead>
        <tbody tuiTbody>
          <tr tuiTr>
            <td *tuiCell="'name'" tuiTd>
              name
            </td>
            <td *tuiCell="'event_name'" tuiTd>
              event name
            </td>
            <td *tuiCell="'grade'" tuiTd>
              grade
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
}
