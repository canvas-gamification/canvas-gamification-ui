<section class="tui-container tui-container_fullwidth">
  <h1 class="tui-text_h3 tui-space_vertical-10">Course List</h1>
  <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
  <tui-textfield [tuiTextfieldCleaner]="true" aria-label="Search Courses" class="tui-space_bottom-4" iconStart="@tui.search">
  <label tuiLabel>Search Courses</label>
  <input tuiInput [(ngModel)]="courseNameSearch" />
  </tui-textfield>
  <div class="course-islands">
    @if (allCourses) {
      @for (course of allCourses | tuiFilter : matchCourseName: courseNameSearch; track course) {
        <app-course-island
          [course]="course"
        ></app-course-island>
      }
    } @else {
      @for (_ of [0, 0, 0, 0, 0, 0]; track _) {
        <app-course-island [skeleton]="true"></app-course-island>
      }
    }
  </div>
</section>
