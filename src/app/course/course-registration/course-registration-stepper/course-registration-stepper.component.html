<tui-stepper [(activeItemIndex)]="currentStep">
  @for (step of steps; track step; let i = $index) {
    <button
      [disabled]="true"
      [stepState]="completedSteps.has(i) ? 'pass' : 'normal'"
      [icon]="completedSteps.has(i) ? '@tui.check' : ''"
      tuiStep>
      {{step}}
    </button>
  }
</tui-stepper>
<ng-content></ng-content>
