<div class="tui-container tui-container_adaptive">
  <form (ngSubmit)="onSubmit()" [formGroup]="formData">
    <h2 class="tui-form__header">{{teamId? 'Edit ' + team?.name: 'Create New Team'}}</h2>
    <div class="tui-form__row">
      <!-- TODO: (Taiga UI migration) tui-input migration (see https://taiga-ui.dev/components/input):
     - "aria" is an unrecognized attribute and was placed on <tui-textfield>. Move it to <input tuiInput> if it targets the native element.
-->
      <tui-textfield aria-label="Team Name">
      <label tuiLabel>Team Name</label>
      <input tuiInput formControlName="name" />
      </tui-textfield>
      <tui-error  formControlName="name"></tui-error>
    </div>
    <div class="tui-form__row">
      <label tuiLabel> <input tuiCheckbox type="checkbox"
        aria-label="Set Team To A Private Team"
        size="m"
        formControlName="isPrivate"
        >
        Check to lock the team so only people you have invited can join your team.
      </label>
      <tui-error  formControlName="isPrivate"></tui-error>
    </div>
    @if (isPrivate()) {
      <div class="tui-form__row">
        <div class="mb-2 mt-5">
          List the people you want to invite to this team.
          You can invite up to {{event.max_team_size - 1}} people.
        </div>
        <tui-textfield multi tuiChevron
          aria-label="Invited Member"
          [stringify]="stringify"
          >
          Invited Members
          <!-- TODO: (Taiga UI migration) (searchChange) was replaced by (input) on <input tuiInputChip (input)="onSearch($any($event).target.value)">. See: https://taiga-ui.dev/components/input-chip -->
<input tuiInputChip formControlName="invitedMembers" (input)="onSearchChange($any($event.target).value)" />
<tui-data-list *tuiDropdown tuiMultiSelectGroup>
            @for (courseReg of getCourseRegistrations(); track courseReg) {
              <button [value]="courseReg" tuiOption>
                {{courseReg.name}}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
      </div>
    }
    <div class="tui-form__buttons">
      <button
        [disabled]="formData.invalid"
        appearance="primary"
        aria-label="Submit"
        class="tui-form__button"
        size="m"
        tuiButton
        type="submit"
        >
        {{teamId? 'Save Changes' : 'Create Team'}}
      </button>
    </div>
  </form>
</div>
