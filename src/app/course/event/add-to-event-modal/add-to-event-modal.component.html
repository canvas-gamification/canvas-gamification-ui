<ng-template
  (tuiDialogChange)="toggleDialog($event)"
  [tuiDialogOptions]="$any({ label: 'Which assessment do you want to add this question to?', size: 'm' })"
  [tuiDialog]="open"
  >
  <h2 class="tui-form__header">Open Assessments</h2>
  @if (openEvents) {
    <div class="tui-space_top-8 space-y-3">
      @for (event of openEvents; track event) {
        <div tuiCardLarge size="s">
          <div class="flex">
            <div class="flex-grow">
              <p class="tui-island__category">{{ event.type }}</p>
              <h3 class="tui-island__title">{{ event.name }}</h3>
            </div>
            <div class="flex items-center">
              <button
                (click)="addToEvent(event)"
                appearance="secondary"
                aria-label="Select"
                size="s"
                tuiButton
                >
                Select
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  }
  <h2 class="tui-form__header">Closed Assessments</h2>
  @if (closedEvents) {
    <div class="tui-space_top-8 space-y-3">
      @for (event of closedEvents; track event) {
        <div tuiCardLarge size="s">
          <div class="flex">
            <div class="flex-grow">
              <p class="tui-island__category">{{ event.type }}</p>
              <h3 class="tui-island__title">{{ event.name }}</h3>
            </div>
            <div class="space-x-4 flex items-center">
              <!-- TODO: (Taiga UI migration) tui-tag/tuiTag migrated to tuiChip. Check visuals and content manually -->
<span tuiChip
                size="m"
                appearance="error"
               
                >
              Closed</span>
              <button
                (click)="addToEvent(event)"
                appearance="secondary"
                aria-label="Select"
                size="s"
                tuiButton
                >
                Select
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  }
  <button
    (click)="toggleDialog(false)"
    aria-label="Close"
    class="tui-space_top-8"
    size="m"
    tuiButton
    type="button"
    >
    Close
  </button>
</ng-template>
