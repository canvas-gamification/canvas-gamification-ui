<tui-root [attr.tuiTheme]="headerComponent.isNightMode() ? 'dark' : null">
    <app-header #headerComponent></app-header>
    <div class="app">
        <main class="app-content">
            <router-outlet></router-outlet>
        </main>
        <ng-container *ngIf="!hideFooterForLanding">
            <app-footer></app-footer>
        </ng-container>
    </div>
</tui-root>
