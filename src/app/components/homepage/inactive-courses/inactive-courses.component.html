<div tuiCardLarge class="tui-space_top-4">
  <h2 class="tui-island__title tui-space_bottom-6">Inactive Courses</h2>
  <div class="course-islands">
    @if (inactiveCourses) {
      @for (course of inactiveCourses; track course) {
        <app-course-island [course]="course"></app-course-island>
      }
    } @else {
      @for (_ of [0, 0, 0]; track _) {
        <app-course-island [skeleton]="true"></app-course-island>
      }
    }
  </div>
</div>
