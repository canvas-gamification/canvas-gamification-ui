<div
    [tuiDropdown]="katexDropdown"
    [(tuiDropdownOpen)]="open"
    tuiDropdownAlign="left"
>
    <button
        [tuiAppearanceState]="open ? 'active' : null"
        appearance="icon"
        class="tool-button"
        iconStart="@tui.te-x"
        size="s"
        tuiIconButton
        type="button"
    ></button>
</div>

<ng-template #katexDropdown>
    <form
        (submit)="insertKatex()"
       
        class="katex-tool"
    >
        <div class="katex-tool_input">
            <tui-input
                (ngModelChange)="equation = $event; displayKatex()"
                [ngModelOptions]="{standalone: true}"
                [ngModel]="equation"
                class="katex-tool_input-text"
            >
                Type an equation
                <input tuiTextfieldLegacy/>
            </tui-input>
            <button
                appearance="icon"
                class="tui-space_left-2"
                iconStart="@tui.circle-check"
                size="s"
                tuiIconButton
                type="submit"
            ></button>
        </div>
        <div>
            <p class="tui-space_vertical-1">Preview:</p>
            <tui-island>
                <div #katexContent></div>
            </tui-island>
        </div>
    </form>
</ng-template>
