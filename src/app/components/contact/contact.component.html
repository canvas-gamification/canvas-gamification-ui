<form (ngSubmit)="onSubmit(formData.value)" [formGroup]="formData">
    <div class="tui-form__row">
        <tui-textfield>
        <label tuiLabel>Email</label>
        <input tuiInput formControlName="email" />
        </tui-textfield>
        <tui-error  formControlName="email"></tui-error>
        <div class="tui-form__field-note">We'll never share your email with anyone else.</div>
    </div>
    <div class="tui-form__row">
        <tui-textfield>
        <label tuiLabel>Full Name</label>
        <input tuiInput formControlName="fullname" />
        </tui-textfield>
        <tui-error  formControlName="fullname"></tui-error>
    </div>
    <div class="tui-form__row">
        <!-- TODO: (Taiga UI migration) tui-textarea migration (see https://taiga-ui.dev/components/textarea):
     - Legacy tui-textarea had a fixed height of 20 rows by default. New component auto-resizes between [min] (default: 1) and [max] (default: 3) rows. Set min and max explicitly if the previous layout needs to be preserved.
-->
        <tui-textfield>
        <label tuiLabel>Comment</label>
        <textarea tuiTextarea formControlName="comment"></textarea>
        </tui-textfield>
        <tui-error  formControlName="comment"></tui-error>
    </div>
    <div class="tui-form__row">
        <re-captcha
            formControlName="recaptcha_key"
            siteKey="{{siteKey}}"
        >
        </re-captcha>
    </div>
    <div class="tui-form__buttons">
        <button [disabled]="formData.invalid" appearance="primary" class="tui-form__button" size="m" tuiButton>Submit
        </button>
    </div>
</form>
