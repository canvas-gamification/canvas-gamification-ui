<form (ngSubmit)="onSubmit(formData.value)" [formGroup]="formData">
    <div class="tui-form__row">
        <tui-input formControlName="email">Email</tui-input>
        <tui-error [error]="[] | tuiFieldError | async" formControlName="email"></tui-error>
        <div class="tui-form__field-note">We'll never share your email with anyone else.</div>
    </div>
    <div class="tui-form__row">
        <tui-input formControlName="fullname">Full Name</tui-input>
        <tui-error [error]="[] | tuiFieldError | async" formControlName="fullname"></tui-error>
    </div>
    <div class="tui-form__row">
        <tui-textarea  formControlName="comment">Comment</tui-textarea>
        <tui-error [error]="[] | tuiFieldError | async" formControlName="comment"></tui-error>
    </div>
    <div class="tui-form__row">
        <re-captcha
            formControlName="recaptcha_key"
            siteKey="{{siteKey}}"
        >
        </re-captcha>
    </div>
    <div class="tui-form__buttons">
        <button [disabled]="formData.invalid" appearance="primary" class="tui-form__button" size="m" tuiButton>Submit
        </button>
    </div>
</form>
