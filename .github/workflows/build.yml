name: build
on:
    push:
jobs:
    lint:
        name: Lint
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
                node: [ '24.16.0' ]
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set Up Node
                uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node }}
                    cache: 'npm'
            -   name: Install dependencies
                run: npm ci
            -   name: Lint
                run: npm run lint
    test:
        name: Test
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
                node: [ '24.16.0' ]
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set Up Node
                uses: actions/setup-node@v4
                with:
                    node-version: ${{ matrix.node }}
                    cache: 'npm'
            -   name: Install dependencies
                run: npm ci
            -   name: Test
                run: npm run test:ci
            #                Disable e2e tests for now
            #            -   name: Test e2e
            #                run: |
            #                    npm run e2e:ci:init
            #                    npm run e2e:ci
            -   name: Archive code coverage result
                if: success() && startsWith(matrix.os, 'ubuntu') && startsWith(matrix.node, '24')
                uses: actions/upload-artifact@v4
                with:
                    name: deploy_coverage
                    path: coverage
    build:
        name: Build
        needs:
            - test
            - lint
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set Up Node
                uses: actions/setup-node@v4
                with:
                    node-version-file: '.nvmrc'
                    cache: 'npm'
            -   name: Install dependencies
                run: npm ci
            -   name: Build
                run: npm run build:ci
            -   name: Create 404.html
                run: npm run copy
            -   name: Archive build
                if: success()
                uses: actions/upload-artifact@v4
                with:
                    name: deploy_dist
                    path: dist
    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/master'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            #   v1 unpacked into a directory named after the artifact; v4 unpacks into
            #   `path`, so it is set explicitly to keep the FOLDER paths below unchanged.
            -   name: Download build
                uses: actions/download-artifact@v4
                with:
                    name: deploy_dist
                    path: deploy_dist
            -   name: Download coverage
                uses: actions/download-artifact@v4
                with:
                    name: deploy_coverage
                    path: deploy_coverage
            -   name: Deploy Code to GitHub Pages
                uses: JamesIves/github-pages-deploy-action@releases/v3
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    BRANCH: gh-pages
                    FOLDER: deploy_dist/canvas-gamification-ui
            -   name: Deploy Coverage to GitHub Pages
                uses: JamesIves/github-pages-deploy-action@releases/v3
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    BRANCH: gh-pages
                    FOLDER: deploy_coverage
                    TARGET_FOLDER: coverage
